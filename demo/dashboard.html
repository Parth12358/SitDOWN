<style>
  :root {
    /* warm palette — espresso ground (#2A1A0E), amber + terracotta accents, cream ink (#FEF3E2) */
    --bg: #2a1a0e; --panel: #35230f; --panel-2: #402914; --edge: #563b1e; --edge-soft: #3c2712;
    --text: #fef3e2; --text-soft: #d7c3a4; --faint: #9c8767;
    --accent: #f4ae52; --accent-2: #d4621a; --accent-dim: #4a3414; --on-accent: #2a1a0e;
    --agent: #d4621a; --human: #f4ae52; --agent-wash: #3a2010; --human-wash: #3b2e0f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --bg: #fef3e2; --panel: #ffffff; --panel-2: #faecd6; --edge: #e7d4b4; --edge-soft: #f0e2cb;
    --text: #2a1a0e; --text-soft: #6b5338; --faint: #a58d68;
    --accent: #d4621a; --accent-2: #b5791a; --accent-dim: #f6e4c6; --on-accent: #fef3e2;
    --agent: #d4621a; --human: #b5791a; --agent-wash: #f6ddc6; --human-wash: #f7ebcf;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 10px; border: 3px solid var(--bg); }

  .shell { height: 100%; display: flex; flex-direction: column; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--edge-soft); flex: none; }
  .mark { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .mark em { font-style: normal; color: var(--accent); }
  .nav { display: flex; gap: 2px; }
  .nav button { border: 0; background: none; color: var(--text-soft); font-size: 13.5px; padding: 6px 11px; border-radius: 7px; }
  .nav button:hover { color: var(--text); background: var(--panel); }
  .nav button.on { color: var(--accent); }
  .bar .sp { flex: 1; }
  .persona { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; }
  .seal { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 12px; font-weight: 600; color: var(--on-accent); border: 0; background: var(--faint); }
  .seal.on { box-shadow: 0 0 0 2px var(--accent); }
  .persona .taglbl { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--faint); padding: 0 6px 0 4px; }
  .seal.all { background: var(--panel-2); color: var(--text-soft); font-size: 15px; }
  .starter.standup { border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
  .starter.standup:hover { background: var(--accent); color: var(--on-accent); }
  .tbtn { border: 1px solid var(--edge); background: var(--panel); color: var(--text-soft); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; }
  .tbtn:hover { color: var(--text); }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* HOME (centered prompt) */
  .home { align-items: center; justify-content: center; text-align: center; padding: 24px; position: relative; overflow: hidden; }
  .home::before { content: ""; position: absolute; top: 34%; left: 50%; width: 620px; height: 620px; transform: translate(-50%,-50%);
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%); filter: blur(12px); pointer-events: none; }
  .home-in { position: relative; width: 100%; max-width: 640px; }
  .hero-mark { font-family: var(--serif); font-size: clamp(38px, 7vw, 62px); font-weight: 600; letter-spacing: -.02em; margin: 0 0 10px; }
  .hero-mark em { font-style: normal; color: var(--accent); }
  .hero-sub { font-family: var(--serif); font-style: italic; font-size: clamp(16px, 2.4vw, 20px); color: var(--text-soft); margin: 0 0 30px; }

  .composer { display: flex; align-items: center; gap: 0; background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 6px 6px 6px 18px; transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  .composer .pre { color: var(--accent); font-family: var(--serif); font-size: 18px; margin-right: 10px; user-select: none; }
  .composer input { flex: 1; border: 0; background: none; color: var(--text); font-size: 17px; padding: 12px 6px; font-family: var(--sans); }
  .composer input::placeholder { color: var(--faint); }
  .composer input:focus { outline: none; }
  .send { border: 0; background: var(--accent); color: var(--on-accent); width: 40px; height: 40px; border-radius: 9px; font-size: 17px; display: grid; place-items: center; flex: none; font-weight: 700; }
  .send:hover { background: var(--accent-2); }

  .starters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .starter { border: 1px solid var(--edge); background: var(--panel); color: var(--text-soft); font-size: 13px; padding: 8px 13px; border-radius: 999px; }
  .starter:hover { color: var(--text); border-color: var(--accent); }
  .starter b { color: var(--accent); font-weight: 600; margin-right: 6px; font-family: var(--mono); font-size: 11px; }
  .scope-line { margin-top: 26px; font-size: 12.5px; color: var(--faint); }
  .scope-line b { color: var(--text-soft); font-weight: 600; }
  .scope-line .k { font-family: var(--mono); font-size: 11px; color: var(--accent); }

  /* THREAD (chat) */
  .thread { }
  .scrollarea { flex: 1; min-height: 0; overflow-y: auto; }
  .col { max-width: 720px; margin: 0 auto; padding: 26px 24px 20px; }
  .msg { padding: 8px 0 22px; }
  .msg .you { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .msg .you .seal { width: 22px; height: 22px; }
  .msg .you .qq { font-family: var(--serif); font-size: 19px; color: var(--text); line-height: 1.35; }
  .msg .meta { display: flex; align-items: center; gap: 10px; margin: -6px 0 12px 31px; font-size: 11.5px; color: var(--faint); }
  .msg .meta .tool { font-family: var(--mono); color: var(--accent); }
  .msg .meta .lat { font-family: var(--mono); }
  .answer { margin-left: 31px; border-left: 2px solid var(--accent); padding-left: 18px; }
  .msg.fresh .answer { animation: ansIn .32s cubic-bezier(.2,.7,.3,1); }
  @keyframes ansIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .think { display: inline-flex; gap: 5px; padding: 4px 0; }
  .think i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .35; animation: think 1s ease-in-out infinite; }
  .think i:nth-child(2){ animation-delay: .18s; } .think i:nth-child(3){ animation-delay: .36s; }
  @keyframes think { 0%,100%{ opacity:.25; transform: translateY(0); } 50%{ opacity: 1; transform: translateY(-3px); } }

  .prose { font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: var(--text); text-wrap: pretty; }
  .prose .lead { margin: 0 0 10px; } .prose p { margin: 0 0 10px; } .prose p:last-child { margin: 0; }

  .record { margin: 10px 0 2px; }
  .record .row { display: grid; grid-template-columns: 86px 1fr; gap: 6px 16px; padding: 4px 0; }
  .record dt { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--text-soft); }
  .record dd { margin: 0; font-family: var(--serif); font-size: 16px; }
  .record .no s { color: var(--faint); }

  .stamp { font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 4px; }
  .stamp.feature { background: var(--panel-2); color: var(--text-soft); border: 1px solid var(--edge); }
  .stamp.agent { background: var(--agent-wash); color: var(--agent); }
  .stamp.human { background: var(--human-wash); color: var(--human); }
  .hand { display: inline-flex; align-items: center; gap: 7px; }
  .hand .seal { width: 20px; height: 20px; font-size: 11px; }
  .by { font-family: var(--serif); }

  .sources { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 7px; align-items: baseline; }
  .sources .lab { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--faint); margin-right: 2px; }
  .src { font-family: var(--mono); font-size: 11px; color: var(--text-soft); background: var(--panel); border: 1px solid var(--edge); padding: 2px 7px; border-radius: 5px; }
  .src.note { color: var(--text); border-color: var(--edge); }

  .finds { display: flex; flex-direction: column; }
  .find { padding: 10px 0; border-top: 1px solid var(--edge-soft); }
  .find:first-child { border-top: 0; }
  .find .t { font-family: var(--serif); font-size: 17px; }
  .find .p { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .find .s { font-family: var(--serif); font-size: 15px; color: var(--text-soft); }

  .rank { display: flex; flex-direction: column; gap: 11px; }
  .rankrow { display: flex; align-items: center; gap: 11px; }
  .rankrow .who b { font-family: var(--serif); font-size: 16px; }
  .rankrow .who small { display: block; font-size: 11.5px; color: var(--faint); }
  .bar2 { flex: 1; height: 3px; background: var(--edge); min-width: 46px; position: relative; }
  .bar2 > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .scoreN { font-family: var(--mono); font-size: 13px; color: var(--text-soft); width: 40px; text-align: right; }
  .askp { border: 1px solid var(--edge); background: none; color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .askp:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .priv { margin-top: 12px; border: 1px solid var(--edge); border-left: 3px solid var(--human); background: var(--panel); padding: 11px 14px; border-radius: 0 8px 8px 0; }
  .priv.locked { border-left-color: var(--faint); border-left-style: dashed; }
  .priv .h { display: flex; gap: 8px; align-items: center; font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--text-soft); margin-bottom: 4px; }
  .priv .h .lk { margin-left: auto; font-style: normal; }
  .priv p { margin: 0; font-family: var(--serif); font-size: 15px; color: var(--text); }
  .priv.locked p { color: var(--faint); }

  .idk .big { font-family: var(--serif); font-size: 20px; margin: 0 0 6px; }
  .idk .s { font-family: var(--serif); font-size: 15px; color: var(--text-soft); margin: 0 0 12px; }

  /* dock */
  .dock { flex: none; border-top: 1px solid var(--edge-soft); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); padding: 14px 24px 18px; }
  .dock .col { padding: 0; }
  .dock .composer { border-radius: 12px; }
  .dock .hint { text-align: center; font-size: 11px; color: var(--faint); margin-top: 8px; }
  .dock .hint b { color: var(--text-soft); font-family: var(--mono); }

  /* browse column */
  .browse { overflow-y: auto; }
  .browse .col { padding: 30px 24px 70px; }
  .vh { margin-bottom: 20px; }
  .vh h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .vh p { margin: 0; color: var(--text-soft); max-width: 60ch; }
  .rec { padding: 18px 0; border-top: 1px solid var(--edge-soft); }
  .rec:first-child { border-top: 0; }
  .rec[data-run] { cursor: pointer; }
  .rec .toprow { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .rec h3 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .rec .kind { font-family: var(--serif); font-style: italic; color: var(--faint); font-size: 13px; }
  .rec .where { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .rec[data-run]:hover h3 { color: var(--accent); }
  .rec[data-run] .toprow::after { content: "ask ↵"; font-family: var(--mono); font-size: 10px; color: var(--faint); opacity: 0; }
  .rec[data-run]:hover .toprow::after { opacity: 1; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: grid; grid-template-columns: 50px 1fr; gap: 12px; padding: 5px 0; font-family: var(--serif); font-size: 15px; color: var(--text-soft); border-bottom: 1px solid var(--edge-soft); }
  .hist li:last-child { border-bottom: 0; }
  .hist .d { font-family: var(--mono); font-size: 11px; color: var(--faint); padding-top: 3px; }
  .hist .x { color: var(--text); }
  .attr { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .attr .track { flex: 1; max-width: 300px; display: flex; height: 6px; border: 1px solid var(--edge); }
  .attr .track > i { height: 100%; }
  .attr .leg { font-family: var(--mono); font-size: 11px; color: var(--text-soft); display: flex; gap: 14px; }
  .attr .leg i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
  .spark > i { flex: 1; background: var(--accent); opacity: .85; }

  .hidden { display: none !important; }
  @media (max-width: 640px) { .nav { display: none; } .col { padding-left: 16px; padding-right: 16px; } }
</style>

/* answer bodies */
function recordDL(d){ return `<dl class="record"><div class="row"><dt>chose</dt><dd>${esc(d.chosen)}</dd></div>
  <div class="row"><dt>rejected</dt><dd class="no"><s>${esc(d.rejected.join("; "))}</s></dd></div>
  <div class="row"><dt>because</dt><dd>${esc(d.reason)}</dd></div></dl>`; }
function sourcesRow(c){ return c&&c.length?`<div class="sources"><span class="lab">from</span>${[...new Set(c)].map(x=>`<span class="src ${x.includes('/')?'note':''}">${esc(x)}</span>`).join("")}</div>`:""; }
function body(res){ switch(res.kind){
  case "brief": return `<p class="prose lead">On <span class="stamp feature">${res.feature}</span> — the latest decisions, and who's in it.</p>
    ${res.decisions.map(d=>`<p class="prose" style="margin:14px 0 2px"><b>${esc(d.title)}</b></p>${recordDL(d)}`).join("")}
    <p class="prose" style="color:var(--text-soft);margin-top:12px">Most active: ${res.who.map(w=>`${seal(w.who)} ${w.who}`).join(", ")||"nobody yet"}.</p>`;
  case "decision": return `<p class="prose lead"><span class="hand">${seal(res.author)}</span> <b>${esc(res.title)}</b> &nbsp;<span class="stamp feature">${res.feature}</span></p>${recordDL(res)}`;
  case "who": { const m=Math.max(...res.ranked.map(r=>r.score)); return `<p class="prose lead">For <span class="stamp feature">${res.feature}</span>, ask:</p><div class="rank">${res.ranked.map(r=>`
    <div class="rankrow">${seal(r.who)}<div class="who"><b>${r.who}</b><small>${r.touches} touches · ${r.commits} commit${r.commits===1?"":"s"} · recency-weighted</small></div>
    <div class="bar2"><i style="width:${Math.round(r.score/m*100)}%"></i></div><span class="scoreN">${r.score.toFixed(2)}</span>
    <button class="askp" onclick="pingPerson('${r.who}','${res.feature}')">Ask ${r.who}</button></div>`).join("")}</div>`; }
  case "summary": return res.people.map(p=>`<div style="margin-bottom:14px">
    <p class="prose" style="margin:0 0 4px"><span class="hand">${seal(p.who)} <b class="by">${p.who}</b></span> worked on ${p.items.map(i=>i.replace(/^Added |^Fixed |^Rate-limited /,"").toLowerCase()).join(", ")}.</p>
    ${p.private?`<div class="priv"><div class="h">${p.who}/me.md<span class="lk">🔓</span></div><p>${esc(p.private)}</p></div>`:""}</div>`).join("");
  case "search": return `<div class="finds">${res.hits.map(h=>`<div class="find"><div class="t">${esc(h.title)}</div><div class="p">${esc(h.path.split("/").slice(1).join("/"))}</div><div class="s">${esc(h.snip)}</div></div>`).join("")}</div>`;
  case "idk": return `<div class="idk"><p class="big">Not in the record — yet.</p><p class="s">Nothing documented covers this. Log it as a gap and whoever owns it next gets nudged to write it down.</p><button class="askp" onclick="logGap()">Log the gap</button></div>`;
  case "ai": return `<div class="prose"${res.found===false?' style="color:var(--text-soft)"':''}>${md(res.answer)}</div>`;
  case "standup": return `<p class="prose lead" style="margin-bottom:6px"><b>Standup</b> — since <span class="mono" style="font-size:13px">${esc(res.since||"last week")}</span>${res.until?` · through <span class="mono" style="font-size:13px">${esc(res.until)}</span>`:""}</p><div class="prose">${md(res.answer)}</div>`;
  case "custom": return res.html; } }

const thinking = `<span class="think"><i></i><i></i><i></i></span>`;
function msgHTML(s, isLast){ return `<div class="msg${isLast&&fresh?' fresh':''}">
  <div class="you">${seal(s.as)}<span class="qq">${esc(s.q)}</span></div>
  <div class="meta"><span class="tool">${s.pending?(s.tool==="ai"?"synthesizing":"querying"):s.tool}</span>${s.pending?"":`<span class="lat">${s.lat} ms</span>`}</div>
  <div class="answer">${s.pending?thinking:body(s.res)+sourcesRow(s.res.citations)}</div></div>`; }

function composer(ph){ return `<div class="composer"><span class="pre">¶</span>
  <input id="askInput" placeholder="${ph}" autocomplete="off" aria-label="Ask a question" />
  <button class="send" id="askGo" aria-label="Ask">▸</button></div>`; }

/* views */
function renderStage(){
  const st = document.getElementById("stage");
  if(view==="ask" && msgs.length===0){
    st.className = "stage home";
    st.innerHTML = `<div class="home-in">
      <h1 class="hero-mark">Sit<em>DOWN</em></h1>
      <p class="hero-sub">Ask in plain language — the AI reads your team's sessions and commits and answers, with sources.</p>
      ${composer("What do you want to know?  (tag anyone with @name)")}
      <div class="starters"><button class="starter standup" data-standup>↻ Since last standup</button>${STARTERS.map(([k,q])=>`<button class="starter" data-q="${esc(q)}"><b>${k}</b>${esc(q)}</button>`).join("")}</div>
      <p class="scope-line">central <b>acme/app</b> &nbsp;·&nbsp; ${tagged?`tagging <span class="k">${tagged}</span>`:`<span class="k">all teammates</span>`} &nbsp;·&nbsp; <span class="k">${LIVE?'live — real vault':'demo data'}</span></p>
    </div>`;
    return;
  }
  if(view==="ask"){
    st.className = "stage thread";
    st.innerHTML = `<div class="scrollarea" id="scroll"><div class="col">${msgs.map((s,i)=>msgHTML(s,i===msgs.length-1)).join("")}</div></div>
      <div class="dock"><div class="col">${composer("Ask a follow-up…  (@name to tag)")}<div class="hint">${tagged?`tagging <b>${tagged}</b>`:"all teammates"} · ${activeTool==="auto"?(LIVE?"<b>AI answer</b> over the docs":"<b>auto</b>"):`tool <b>${activeTool}</b>`} · press <b>/</b> to focus</div></div></div>`;
    const sc = document.getElementById("scroll"); if(sc) sc.scrollTop = sc.scrollHeight;
    return;
  }
  st.className = "stage browse";
  st.innerHTML = `<div class="col">${BROWSE[view]()}</div>`;
}

const BROWSE = {
  decisions: () => `<div class="vh"><h1>Decisions</h1><p>The reasoning the diff never shows — what was chosen, what was turned down, and why.</p></div>
    ${Object.entries(DECISIONS).map(([slug,d])=>`<div class="rec" data-run="get_decision" data-arg="${esc(d.title)}">
      <div class="toprow"><h3>${esc(d.title)}</h3><span class="kind">${d.feature}</span><span class="where">${slug}</span></div>${recordDL(d)}
      <div class="sources"><span class="lab">recorded by</span><span class="hand">${seal(d.author)} <span class="by" style="font-size:14px">${d.author}</span></span>${d.sources.map(s=>`<span class="src">${s}</span>`).join("")}</div></div>`).join("")}`,
  features: () => `<div class="vh"><h1>Features</h1><p>History newest first, with how much was written by an agent versus a human — recorded at the source, not guessed.</p></div>
    ${Object.entries(FEATURES).map(([n,ft])=>{ const tot=ft.attribution.agent+ft.attribution.human||1, ap=Math.round(ft.attribution.agent/tot*100);
      return `<div class="rec" data-run="get_brief" data-arg="${n}"><div class="toprow"><h3>${n}</h3><span class="kind">feature</span><span class="where">${ft.path}</span></div>
      <ul class="hist">${ft.history.map(h=>`<li><span class="d">${h.date.slice(5)}</span><span><span class="x">${esc(h.headline)}</span>${h.decision?` <span class="stamp feature">decision</span>`:""}</span></li>`).join("")}</ul>
      <div class="attr"><div class="track"><i style="width:${ap}%;background:var(--agent)"></i><i style="width:${100-ap}%;background:var(--human)"></i></div>
        <div class="leg"><span><i style="background:var(--agent)"></i>agent ${ap}%</span><span><i style="background:var(--human)"></i>human ${100-ap}%</span></div></div></div>`; }).join("")}`,
  people: () => `<div class="vh"><h1>People</h1><p>Who worked on what. As the operator you can tag anyone to pull their view — click a card to ask about them.</p></div>
    ${Object.keys(PEOPLE).map(n=>{ const feats=Object.entries(FEATURES).filter(([,f])=>f.history.some(h=>h.who===n)).map(([k])=>k); const decs=Object.entries(DECISIONS).filter(([,d])=>d.author===n);
      return `<div class="rec" data-run="get_summary" data-arg="what has ${n} been working on"><div class="toprow"><span class="hand">${seal(n)} <h3 style="margin:0">${n}</h3></span>${n===tagged?`<span class="stamp feature">tagged</span>`:""}<span class="where">central/people/${n}.md</span></div>
      <ul class="hist"><li><span class="d">feat</span><span class="x">${feats.join(", ")||"—"}</span></li>${decs.map(([,d])=>`<li><span class="d">why</span><span class="x">${esc(d.title)}</span></li>`).join("")}</ul>
      <div class="priv"><div class="h">${n}/me.md<span class="lk">🔓</span></div><p>${esc(PRIVATE_ME[n]||"—")}</p></div></div>`; }).join("")}`,
  activity: () => { const c={}; EVENTS.forEach(([n])=>c[n]=(c[n]||0)+1); const bars=[3,5,2,6,4,7,5,8,6,9,7,10];
    return `<div class="vh"><h1>Activity</h1><p>The typed event stream behind <span class="mono">who_knows</span> and gap detection — categories and counts only, never raw text.</p></div>
    <div class="rec" style="border-top:0"><div class="toprow"><h3 style="font-size:17px">This week</h3><span class="where">event_store: sqlite</span></div><div class="spark">${bars.map(b=>`<i style="height:${b/10*100}%"></i>`).join("")}</div></div>
    <div class="rec"><div class="toprow"><h3 style="font-size:17px">By type</h3><span class="kind">${EVENTS.length} events, 2 people</span></div>
      <ul class="hist">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([n,k])=>`<li><span class="d mono" style="color:var(--text)">${n}</span><span class="x mono" style="color:var(--faint)">×${k}</span></li>`).join("")}</ul></div>`; },
};

function renderTags(){ document.getElementById("persona").innerHTML =
  `<span class="taglbl">tag</span><button class="seal all ${tagged?'':'on'}" data-p="all" title="all teammates">∗</button>`
  + Object.keys(PEOPLE).map(n=>`<button class="seal ${n===tagged?'on':''}" data-p="${n}" style="background:${PEOPLE[n].color}" title="tag ${n}">${n[0].toUpperCase()}</button>`).join(""); }
function render(){ renderStage(); fresh=false; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
  renderTags(); const i=document.getElementById("askInput"); if(i && view==="ask") i.focus(); }

function pingPerson(w,f){ msgs.push({q:`Route a question on ${f} to ${w}`,tool:"ask_person",as:tagged||"you",lat:rnd(3,12),
  res:{kind:"custom",citations:["event_store:sqlite"],html:`<p class="prose lead">Drafted for <span class="hand">${seal(w)} <b class="by">${w}</b></span> <span class="mono" style="font-size:12px;color:var(--faint)">${PEOPLE[w].contact}</span></p>
  <div class="priv"><p>“Hey ${w} — quick one on <b>${f}</b>, you're closest to it. Grab me in standup?”</p></div>
  <p class="prose" style="color:var(--text-soft);font-size:14px;margin-top:10px">Sends via voice / standup and records a <span class="mono" style="font-size:12px">QuestionAsked</span> event.</p>`}}); fresh=true; render(); }
function logGap(){ msgs.push({q:"Log this as a documentation gap",tool:"log_unanswered",as:tagged||"you",lat:rnd(3,10),
  res:{kind:"custom",citations:["event_store:sqlite"],html:`<p class="prose lead">Logged. ✓</p><p class="prose" style="color:var(--text-soft)">Wrote <span class="mono" style="font-size:12px">QuestionAsked</span> + <span class="mono" style="font-size:12px">AnswerFound(false)</span> — it'll surface to whoever owns this next.</p>`}}); fresh=true; render(); }

document.addEventListener("click", e=>{
  if(e.target.closest("[data-standup]")){ runStandup(); return; }
  const rec=e.target.closest(".rec[data-run]"); if(rec){ activeTool=rec.dataset.run; ask(rec.dataset.arg).then(()=>{ activeTool="auto"; }); return; }
  const nv=e.target.closest("#nav button"); if(nv){ if(nv.dataset.action==="standup"){ runStandup(); return; } view=nv.dataset.view; render(); return; }
  const p=e.target.closest(".persona .seal"); if(p){ tagged = p.dataset.p==="all" ? null : p.dataset.p; render(); return; }
  const st=e.target.closest(".starter[data-q]"); if(st){ ask(st.dataset.q); return; }
  if(e.target.closest("#askGo")){ ask(document.getElementById("askInput").value); return; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="askInput"){ ask(e.target.value); return; }
  if(e.key==="/" && !/^(input|textarea)$/i.test(e.target.tagName)){ e.preventDefault(); if(view!=="ask") { view="ask"; render(); } const i=document.getElementById("askInput"); if(i) i.focus(); }
});
document.getElementById("themeBtn").addEventListener("click", ()=>{ const cur=document.documentElement.getAttribute("data-theme")||"light"; document.documentElement.setAttribute("data-theme", cur==="light"?"dark":"light"); });
document.documentElement.setAttribute("data-theme","light"); // cream ground by default
render();
// If served by demo/serve.mjs, switch to the real MCP tools over the live vault.
fetch("/api/health").then(r=>r.ok?r.json():null).then(h=>{ if(h&&h.ok){ LIVE=true; if(view==="ask"&&msgs.length===0) render(); } }).catch(()=>{});
</script>
